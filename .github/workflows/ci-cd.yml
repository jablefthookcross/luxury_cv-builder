name: VitaeCraft AI - CI/CD Pipeline & Automated QA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    name: 🧪 Unit Tests & Python QA Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Python Unit Tests & Fast Checks
        run: |
          PYTHONPATH=. python test_app.py

  playwright-qa-suite:
    name: 🎭 Playwright E2E & API Automation with Allure
    runs-on: ubuntu-latest
    needs: test-and-audit

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install Python backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Node.js QA dependencies
        run: npm ci

      - name: 🌐 Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: 🚀 Run Playwright Test Suite (API + E2E Chromium)
        env:
          CI: "true"
          PORT: 5000
          ADMIN_CLEANUP_SECRET: "vitaecraft-nuclear-secret-2026"
        run: npx playwright test

      - name: 📊 Generate Allure QA Report
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report || echo "Allure generation finished"

      - name: 📤 Upload Playwright Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: 📤 Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  deploy:
    name: 🚀 Continuous Deployment (CD) - Deploy to Render
    needs: [test-and-audit, playwright-qa-suite]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering deployment on Render.com..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Skipping CD trigger."
          fi
