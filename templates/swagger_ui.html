<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitaeCraft AI - Swagger API Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui.css">
  <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/favicon-32x32.png">
  <style>
    :root {
      --bg-main: #0a0e17;
      --bg-card: #0f172a;
      --border-color: #1e293b;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Custom Header Bar */
    .custom-swagger-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
    }

    .brand-badge {
      font-size: 0.72rem;
      background: rgba(139, 92, 246, 0.2);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.4);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    .nav-links a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      border: 1px solid rgba(96, 165, 250, 0.3);
      transition: all 0.2s ease;
    }

    .nav-links a:hover {
      background: rgba(96, 165, 250, 0.15);
      border-color: #60a5fa;
      color: #93c5fd;
    }

    /* Swagger Dark Theme Overrides */
    .swagger-ui {
      color: #f1f5f9;
    }

    .swagger-ui .topbar {
      display: none !important;
    }

    .swagger-ui .info {
      margin: 1.5rem 0 2rem 0;
    }

    .swagger-ui .info .title {
      color: #c084fc;
      font-family: inherit;
      font-weight: 800;
    }

    .swagger-ui .info p, 
    .swagger-ui .info li,
    .swagger-ui .info .description {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .swagger-ui .scheme-container {
      background: var(--bg-card);
      box-shadow: none;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
    }

    .swagger-ui .opblock {
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      margin: 0 0 1rem;
    }

    .swagger-ui .opblock.opblock-post {
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.04);
    }
    .swagger-ui .opblock.opblock-post .opblock-summary-method {
      background: #10b981;
    }

    .swagger-ui .opblock.opblock-get {
      border-color: rgba(59, 130, 246, 0.3);
      background: rgba(59, 130, 246, 0.04);
    }
    .swagger-ui .opblock.opblock-get .opblock-summary-method {
      background: #3b82f6;
    }

    .swagger-ui .opblock.opblock-delete {
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.04);
    }
    .swagger-ui .opblock.opblock-delete .opblock-summary-method {
      background: #ef4444;
    }

    .swagger-ui .opblock.opblock-put {
      border-color: rgba(245, 158, 11, 0.3);
      background: rgba(245, 158, 11, 0.04);
    }
    .swagger-ui .opblock.opblock-put .opblock-summary-method {
      background: #f59e0b;
    }

    .swagger-ui .opblock .opblock-summary-operation-id,
    .swagger-ui .opblock .opblock-summary-path,
    .swagger-ui .opblock .opblock-summary-path__deprecated {
      color: #e2e8f0;
      font-weight: 600;
    }

    .swagger-ui .opblock .opblock-summary-description {
      color: #94a3b8;
    }

    .swagger-ui .opblock-body {
      background: #080c14;
    }

    .swagger-ui .opblock-description-wrapper p, 
    .swagger-ui .opblock-external-docs-wrapper p, 
    .swagger-ui .opblock-title_normal p {
      color: #e2e8f0;
    }

    .swagger-ui table thead tr td, 
    .swagger-ui table thead tr th {
      color: #94a3b8;
      border-bottom: 1px solid #334155;
    }

    .swagger-ui .parameters-col_name {
      color: #60a5fa;
      font-weight: 600;
    }

    .swagger-ui .parameter__name {
      color: #60a5fa;
      font-weight: 600;
    }

    .swagger-ui .parameter__type {
      color: #c084fc;
    }

    .swagger-ui input[type=text], 
    .swagger-ui textarea {
      background: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #334155 !important;
      border-radius: 6px !important;
    }

    .swagger-ui select {
      background: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #334155 !important;
      border-radius: 6px !important;
    }

    .swagger-ui .btn {
      border-radius: 6px;
      font-weight: 600;
    }

    .swagger-ui .btn.authorize {
      color: #10b981;
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.1);
    }
    .swagger-ui .btn.authorize svg {
      fill: #10b981;
    }

    .swagger-ui .btn.execute {
      background-color: #7c3aed;
      border-color: #7c3aed;
      color: #fff;
    }
    .swagger-ui .btn.execute:hover {
      background-color: #6d28d9;
    }

    .swagger-ui .responses-inner {
      background: #080c14;
    }

    .swagger-ui .response-col_status {
      color: #34d399;
      font-weight: 700;
    }

    .swagger-ui .model-box {
      background: #0f172a;
      border-radius: 6px;
      padding: 0.5rem;
    }

    .swagger-ui section.models {
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      border-radius: 8px;
    }

    .swagger-ui section.models h4 {
      color: #c084fc;
    }

    .swagger-ui .model-title {
      color: #e2e8f0;
    }

    .swagger-ui .prop-type {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="custom-swagger-header">
    <div class="brand-title">
      <span>⚡ VitaeCraft AI</span>
      <span class="brand-badge">OpenAPI 3.0 / Swagger</span>
    </div>
    <div class="nav-links">
      <a href="/" target="_self">🏠 Powrót do Aplikacji</a>
    </div>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: '/api/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        displayRequestDuration: true,
        docExpansion: "list",
        filter: true,
        persistAuthorization: true
      });
    };
  </script>
</body>
</html>
